<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Country Explorer</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>Global Country Explorer</h1>
        <p>Explore stats and demographic data for countries across the globe.</p>
    </header>

    <main>
        <section class="content-section">
            <h2>Country Dashboard</h2>

            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Global Country Explorer Capstone</p>
    </footer>

    <script src="app.js"></script>
</body>
</html>
